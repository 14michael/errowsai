name: Phase 2 | Free Build Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-build-verification.yml'
      - 'apps/**'
      - 'backend/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: errows-free-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Frontend and backend build (no paid APIs)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build React application
        run: pnpm --filter errows-web build
      - name: Build Moleculer server
        run: pnpm --filter @errows/server build
      - name: Retain frontend build artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: errows-frontend-build
          path: apps/errows-web/dist/
          if-no-files-found: error
          retention-days: 7

  original-tests:
    name: Original test suite — expose external-service blockers
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run original tests unmodified; no fake secrets
        run: pnpm --filter @errows/server test
