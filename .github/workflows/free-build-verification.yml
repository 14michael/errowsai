name: Phase 2 | Free Build Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-build-verification.yml'
      - 'apps/**'
      - 'backend/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: errows-free-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build front end and server without paid services
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: "true"
      NODE_ENV: "development"
    steps:
      - name: Checkout original source
        uses: actions/checkout@v4
      - name: Install Node.js and cache pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build user-facing React application
        run: pnpm --filter errows-web build
      - name: Build Moleculer API backend
        run: pnpm --filter @errows/server build
      - name: Run existing backend unit tests (no paid APIs)
        run: pnpm --filter @errows/server test
      - name: Upload frontend build as proof (not public deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: errows-frontend-build
          path: apps/errows-web/dist/
          if-no-files-found: error
          retention-days: 7
